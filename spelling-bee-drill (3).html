<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spelling drill — finals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#17130D; --surface:#211B12; --raised:#2B2317; --line:#3A3020;
    --honey:#E8A93B; --honey-dim:#8C6A2A; --cream:#F5EEDD; --muted:#9C9080;
    --ok:#8FAE5D; --ok-dim:#3C4A28; --miss:#D06B4F; --miss-dim:#4A2B20;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--cream);font-family:'Inter',sans-serif;padding:32px 18px 60px;display:flex;justify-content:center}
  .wrap{width:100%;max-width:1020px}
  .layout{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:20px;align-items:stretch}
  .col{display:flex;flex-direction:column;gap:20px;min-width:0}
  .col .card{margin-bottom:0}
  .col-right .card{flex:1}
  @media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;color:var(--honey);text-transform:uppercase;margin:0 0 6px}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:34px;margin:0 0 4px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:14px;margin:0 0 26px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:20px}
  .card h2{font-family:'Fraunces',serif;font-weight:600;font-size:16px;margin:0 0 14px}
  textarea{width:100%;min-height:120px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--cream);font-family:'JetBrains Mono',monospace;font-size:12.5px;padding:12px;resize:vertical;line-height:1.6}
  .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  button{font-family:'Inter',sans-serif;font-weight:500;font-size:13.5px;border-radius:8px;border:1px solid var(--line);background:var(--raised);color:var(--cream);padding:10px 16px;cursor:pointer;transition:border-color .15s,background .15s}
  button:hover{border-color:var(--honey-dim)}
  button:active{transform:scale(.98)}
  button.primary{background:var(--honey);color:#241A08;border-color:var(--honey);font-weight:600}
  button.primary:hover{background:#f0b64f}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .chip{font-family:'JetBrains Mono',monospace;font-size:11.5px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);color:var(--muted);cursor:pointer;background:var(--surface);user-select:none}
  .chip:hover{border-color:var(--honey-dim)}
  .chip.active{border-color:var(--honey);color:var(--honey);background:var(--raised)}
  .quiz-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
  .progress-text{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
  .link{font-size:12px;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:2px;user-select:none}
  .link:hover{color:var(--honey)}
  .speak-zone{text-align:center;padding:14px 0 4px}
  .speak-btn{width:96px;height:96px;border-radius:50%;background:var(--raised);border:2px solid var(--honey-dim);color:var(--honey);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:34px;transition:transform .1s,border-color .15s;user-select:none;padding:0}
  .speak-btn:hover{border-color:var(--honey);transform:scale(1.03)}
  .speak-btn.speaking{border-color:var(--honey);background:#3a2f1c}
  .rate-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px}
  .rate-row label{font-size:12px;color:var(--muted)}
  input[type=range]{width:150px;accent-color:var(--honey)}
  .answer-row{display:flex;gap:10px;margin-top:20px}
  input[type=text]{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--cream);font-family:'JetBrains Mono',monospace;font-size:16px;padding:12px 14px;letter-spacing:.04em}
  input[type=text]:focus{outline:none;border-color:var(--honey)}
  .feedback{margin-top:16px;padding:12px 14px;border-radius:8px;font-size:14px;line-height:1.5;display:none}
  button.mic{padding:10px 14px;font-size:17px;line-height:1;min-width:48px}
  button.mic.listening{background:var(--miss-dim);border-color:var(--miss);color:var(--miss);animation:pulse 1.1s ease-in-out infinite}
  button.mic:disabled{opacity:.35;cursor:not-allowed}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  @media (prefers-reduced-motion:reduce){button.mic.listening{animation:none}}
  .heard{margin-top:10px;min-height:17px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);letter-spacing:.08em}
  .heard b{color:var(--honey);font-weight:500}
  .feedback.show{display:block}
  .feedback.correct{background:var(--ok-dim);color:var(--ok);border:1px solid var(--ok)}
  .feedback.wrong{background:var(--miss-dim);color:var(--miss);border:1px solid var(--miss)}
  .feedback.unclear{background:#3a2f1c;color:var(--honey);border:1px solid var(--honey-dim)}
  .feedback b{font-family:'JetBrains Mono',monospace;letter-spacing:.06em;font-weight:500}
  .stat-row{display:flex;gap:12px;margin-top:22px}
  .stat{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 8px;text-align:center}
  .stat .n{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:500}
  .stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
  .stat.m .n{color:var(--ok)} .stat.h .n{color:var(--miss)} .stat.t .n{color:var(--honey)}
  .comb{display:flex;flex-direction:column;align-items:center}
  .comb-row{display:flex} .comb-row.odd{margin-left:10px}
  .hex{width:17px;height:19px;margin:1.5px;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);background:var(--line)}
  .hex.mastered{background:var(--ok)} .hex.hard{background:var(--miss)} .hex.learning{background:var(--honey)}
  .hex.current{outline:2px solid var(--cream);outline-offset:1px}
  .legend{display:flex;flex-direction:column;gap:8px;align-items:flex-start;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
  .legend span{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .dot{width:9px;height:9px;border-radius:2px;display:inline-block}
  .note{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.5}
  #setupCard{display:none}
  .hidden{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Finals — Monday</p>
  <h1>Spelling drill</h1>
  <p class="sub">Hear it, spell it, get the miss corrected out loud.</p>

  <div class="layout">
  <div class="col col-left">

  <div class="card">
    <div class="chips" id="chips"></div>
    <div class="quiz-top">
      <span class="progress-text" id="progressText">loading…</span>
      <span class="link" id="toggleSetup">edit word list</span>
    </div>

    <div id="quizBody">
      <div class="speak-zone">
        <button class="speak-btn" id="speakBtn" aria-label="Hear the word">&#9654;</button>
        <div class="rate-row">
          <label for="rate">Slow</label>
          <input type="range" id="rate" min="0.4" max="1" step="0.05" value="0.75">
          <label for="rate">Normal</label>
        </div>
      </div>

      <div class="answer-row">
        <input type="text" id="answer" placeholder="Type the spelling" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button class="mic" id="micBtn" aria-label="Spell out loud">&#127908;</button>
        <button class="primary" id="checkBtn">Check</button>
      </div>

      <div class="heard" id="heard"></div>

      <div class="feedback" id="feedback"></div>

      <div class="row" style="margin-top:18px">
        <button id="repeatBtn">Repeat word</button>
        <button id="defineBtn">Spell it to me</button>
        <button id="skipBtn">Skip</button>
      </div>
    </div>

    <div id="emptyState" class="hidden" style="text-align:center;color:var(--muted);font-size:13px;padding:34px 0"></div>

    <div class="stat-row">
      <div class="stat t"><div class="n" id="statTotal">—</div><div class="l">Total</div></div>
      <div class="stat m"><div class="n" id="statMastered">—</div><div class="l">Mastered</div></div>
      <div class="stat h"><div class="n" id="statHard">—</div><div class="l">Hard</div></div>
    </div>
    <p class="note" id="storageNote"></p>
  </div>

  <div class="card" id="setupCard">
    <h2>Word list</h2>
    <textarea id="wordArea" spellcheck="false"></textarea>
    <div class="row">
      <button class="primary" id="saveBtn">Save list</button>
      <button id="resetBtn">Reset progress</button>
    </div>
  </div>

  </div>
  <div class="col col-right">

  <div class="card">
    <h2>Progress comb</h2>
    <div class="comb" id="comb"></div>
    <div class="legend">
      <span><i class="dot" style="background:var(--line)"></i>untested</span>
      <span><i class="dot" style="background:var(--honey)"></i>learning</span>
      <span><i class="dot" style="background:var(--miss)"></i>hard</span>
      <span><i class="dot" style="background:var(--ok)"></i>mastered</span>
    </div>
  </div>

  </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var DEFAULT_WORDS = ["degenerate","utilitarian","altruism","planetarium","mantelpiece","wheelwright","recognition","comportment","significant","magnificent","contentedly","destination","reactionary","germane","indifferent","historical","depredation","figurative","nefarious","immaculate","necessities","transferred","execrate","encumbrance","filial","premonition","fallibility","picturesque","asphyxiate","proportions","fabricated","kamikaze","melange","considered","stereotype","mathematics","alopecia","scientific","extenuating","domicile","contraband","foreshadow","maladjusted","consequence","abjure","tympanum","opprobrious","collections","quarantine","pernicious","enterprise","insouciance","production","consanguineous","consumptive","irrelevant","anatomical","recommendation","tradition","compromise","arithmetic","derivative","cadence","impervious","polysaccharide","indiscriminate","regrettable","tribunal","journalism","charioteer","nonexistent","ineluctable","anachronistic","deductible","fashionable","milieu","ostentatiously","peacefully","patronymic","competition","impalpable","respiration","orthopaedic","philosopher","tempestuous","requiem","interpreter","explanation","shrubbery","sedulous","indignantly","demagogue","preparatory","personality","discipline","compliance","likelihood","amputate","advancement","quotient","liquidation","unconcerned","illustrious","chromium","fealty","colloquial","misdemeanor","unrequited","industrious","gravitation","torpor","consignment","abeyance","verbatim","antithesis","antibiotics","frantically","plasticity","martinet","sapiential","perspicuous","zinciferous","lilliputian","treacherous","nuisance","imperial","continental","dilatory","hesitation","commutation","labyrinth","implicitly","profligate","putrefy","circumlocution","assimilate","amputation","shimmering","concordance","unintelligible","ingredient","respectful","confederacy","noticeboard","transcendental","correction","discriminating","photograph","monumental","fractional","deliveries","frightened","hodgepodge","instructor","repugnance","faithfully","definition","salmonella","introduced","interested","interpretation","philanthropist"];

  var words = DEFAULT_WORDS.slice();
  var progress = {};
  var filter = "all";
  var queue = [];
  var current = null;
  var voice = null;
  var storageOK = false;
  var advanceTimer = null;

  function $(id) { return document.getElementById(id); }

  function pickVoice() {
    if (!("speechSynthesis" in window)) return;
    var vs = speechSynthesis.getVoices() || [];
    voice = null;
    for (var i = 0; i < vs.length; i++) {
      if (vs[i].lang === "en-US") { voice = vs[i]; break; }
    }
    if (!voice) {
      for (var j = 0; j < vs.length; j++) {
        if (vs[j].lang && vs[j].lang.indexOf("en") === 0) { voice = vs[j]; break; }
      }
    }
    if (!voice && vs.length) voice = vs[0];
  }

  if ("speechSynthesis" in window) {
    pickVoice();
    speechSynthesis.addEventListener("voiceschanged", pickVoice);
  }

  function speak(text, rateOverride, spellOut) {
    if (!("speechSynthesis" in window)) return;
    try {
      speechSynthesis.cancel();
      var payload = spellOut ? text.toUpperCase().split("").join(", ") : text;
      var u = new SpeechSynthesisUtterance(payload);
      if (voice) u.voice = voice;
      u.lang = "en-US";
      var r = parseFloat($("rate").value);
      u.rate = rateOverride || (isNaN(r) ? 0.8 : r);
      var btn = $("speakBtn");
      u.onstart = function () { btn.classList.add("speaking"); };
      u.onend = function () { btn.classList.remove("speaking"); };
      u.onerror = function () { btn.classList.remove("speaking"); };
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  var LETTER_MAP = {
    "a":"a","ay":"a","eh":"a","aye":"a",
    "b":"b","be":"b","bee":"b","bea":"b",
    "c":"c","see":"c","sea":"c","cee":"c","si":"c",
    "d":"d","dee":"d","de":"d",
    "e":"e","ee":"e","eee":"e",
    "f":"f","ef":"f","eff":"f",
    "g":"g","gee":"g","ge":"g","jee":"g",
    "h":"h","aitch":"h","haitch":"h","ache":"h","etch":"h",
    "i":"i","eye":"i","ai":"i",
    "j":"j","jay":"j","jae":"j",
    "k":"k","kay":"k","cay":"k","okay":"k",
    "l":"l","el":"l","ell":"l","elle":"l",
    "m":"m","em":"m","emm":"m",
    "n":"n","en":"n","enn":"n",
    "o":"o","oh":"o","owe":"o",
    "p":"p","pee":"p","pea":"p","pe":"p",
    "q":"q","cue":"q","queue":"q","kyu":"q",
    "r":"r","are":"r","ar":"r","arr":"r",
    "s":"s","es":"s","ess":"s","yes":"s",
    "t":"t","tee":"t","tea":"t","te":"t",
    "u":"u","you":"u","yu":"u","ewe":"u",
    "v":"v","vee":"v","ve":"v",
    "w":"w","doubleu":"w","dubya":"w","dub":"w",
    "x":"x","ex":"x","eks":"x","axe":"x",
    "y":"y","why":"y","wye":"y",
    "z":"z","zee":"z","zed":"z","zi":"z"
  };

  function transcriptToLetters(raw, target) {
    if (!raw) return "";
    var t = raw.toLowerCase().replace(/[^a-z\s-]/g, " ").replace(/-/g, " ");
    var tokens = t.split(/\s+/).filter(Boolean);
    var out = [];
    for (var i = 0; i < tokens.length; i++) {
      var tok = tokens[i];
      if (tok === "double" && i + 1 < tokens.length) {
        var nxt = tokens[i + 1];
        if (nxt === "u" || nxt === "you" || nxt === "yu") { out.push("w"); i++; continue; }
        if (LETTER_MAP[nxt]) { out.push(LETTER_MAP[nxt], LETTER_MAP[nxt]); i++; continue; }
      }
      if (target && tok === target.toLowerCase()) continue;
      if (LETTER_MAP[tok]) { out.push(LETTER_MAP[tok]); continue; }
      if (NATO[tok]) { out.push(NATO[tok]); continue; }
      out.push(tok);
    }
    return out.join("");
  }

  var NATO = {
    "alpha":"a","alfa":"a","apple":"a",
    "bravo":"b","boy":"b",
    "charlie":"c","charly":"c","cat":"c",
    "delta":"d","dog":"d",
    "echo":"e","easy":"e",
    "foxtrot":"f","fox":"f",
    "golf":"g","george":"g",
    "hotel":"h","henry":"h",
    "india":"i","item":"i",
    "juliet":"j","juliett":"j","john":"j",
    "kilo":"k","king":"k",
    "lima":"l","love":"l",
    "mike":"m","mary":"m",
    "november":"n","nancy":"n",
    "oscar":"o","ocean":"o",
    "papa":"p","peter":"p",
    "quebec":"q","queen":"q",
    "romeo":"r","robert":"r",
    "sierra":"s","sugar":"s",
    "tango":"t","tommy":"t",
    "uniform":"u","uncle":"u",
    "victor":"v","victory":"v",
    "whiskey":"w","whisky":"w","william":"w",
    "xray":"x","x-ray":"x",
    "yankee":"y","young":"y",
    "zulu":"z","zebra":"z"
  };

  var CONFUSABLE = ["bp","bd","bv","bg","be","bc","bt","pt","pe","pd","dt","de","dg","dv","mn","fs","fx","sx","sf","cz","ce","ct","cd","ge","gj","jk","ka","iy","ae","ai","vd","vb","tz","ou","uw","ln","mno"];

  function confusable(a, b) {
    for (var i = 0; i < CONFUSABLE.length; i++) {
      if (CONFUSABLE[i].indexOf(a) !== -1 && CONFUSABLE[i].indexOf(b) !== -1) return true;
    }
    return false;
  }

  function nearMiss(heard, target) {
    if (!heard || heard.length !== target.length) return false;
    var diffs = 0;
    for (var i = 0; i < heard.length; i++) {
      if (heard[i] !== target[i]) {
        if (!confusable(heard[i], target[i])) return false;
        diffs++;
      }
    }
    return diffs > 0 && diffs <= 2;
  }

  var recog = null, micOn = false, finalBuffer = "", micStream = null;

  function setHeard(text, live, note) {
    var el = $("heard");
    if (note) { el.textContent = note; return; }
    if (!text) { el.textContent = micOn ? "listening\u2026 spell it out" : ""; return; }
    el.innerHTML = (live ? "hearing " : "heard ") + "<b>" + text.toUpperCase().split("").join("-") + "</b>";
  }

  function warmMic() {
    if (micStream || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return Promise.resolve();
    return navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
      micStream = s;
    }).catch(function () {});
  }

  function initRecognition() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      $("micBtn").disabled = true;
      $("micBtn").title = "Speech recognition isn't supported in this browser";
      $("heard").textContent = "voice input needs chrome, edge, or safari";
      return;
    }
    recog = new SR();
    recog.lang = "en-US";
    recog.continuous = true;
    recog.interimResults = true;
    recog.maxAlternatives = 6;

    recog.onstart = function () {
      $("micBtn").classList.add("listening");
      $("micBtn").innerHTML = "&#9632;";
      setHeard("", false);
    };

    recog.onresult = function (e) {
      var target = (current || "").toLowerCase();
      var interim = "";
      for (var i = e.resultIndex; i < e.results.length; i++) {
        var res = e.results[i];
        var best = "";
        for (var j = 0; j < res.length; j++) {
          var cand = transcriptToLetters(res[j].transcript, target);
          if (!best) best = cand;
          if (target && (finalBuffer + cand) === target) { best = cand; break; }
        }
        if (res.isFinal) finalBuffer += best;
        else interim += best;
      }
      setHeard(finalBuffer + interim, !!interim);
      if (target && finalBuffer === target) {
        stopMic(true);
      }
    };

    recog.onerror = function (e) {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        micOn = false;
        $("micBtn").classList.remove("listening");
        $("micBtn").innerHTML = "&#127908;";
        setHeard("", false, "microphone blocked \u2014 allow access in your browser");
      }
    };

    recog.onend = function () {
      if (micOn) {
        try { recog.start(); } catch (e) {}
        return;
      }
      $("micBtn").classList.remove("listening");
      $("micBtn").innerHTML = "&#127908;";
    };
  }

  function stopMic(grade) {
    micOn = false;
    try { recog.stop(); } catch (e) {}
    $("micBtn").classList.remove("listening");
    $("micBtn").innerHTML = "&#127908;";
    if (!grade) return;
    var target = (current || "").toLowerCase();
    var heard = finalBuffer;
    if (!heard) { setHeard("", false, "nothing heard \u2014 tap the mic and spell again"); return; }
    if (heard !== target && nearMiss(heard, target)) {
      var fb = $("feedback");
      fb.className = "feedback show unclear";
      fb.innerHTML = "Audio unclear \u2014 heard <b>" + heard.toUpperCase().split("").join("-") +
        "</b>. Not scored. Spell it again, or say the letter word (\u201cpapa\u201d for P, \u201cbravo\u201d for B).";
      finalBuffer = "";
      return;
    }
    $("answer").value = heard;
    check();
  }

  function toggleMic() {
    if (!recog || !current) return;
    if (micOn) { stopMic(true); return; }
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    finalBuffer = "";
    micOn = true;
    warmMic().then(function () {
      try { recog.start(); } catch (e) {}
    });
  }

  function statusOf(w) {
    var p = progress[w];
    if (!p) return "new";
    if (p.streak >= 3) return "mastered";
    if (p.lastWrong) return "hard";
    return "learning";
  }

  function poolFor(f) {
    if (f === "all") return words.slice();
    var out = [];
    for (var i = 0; i < words.length; i++) {
      if (statusOf(words[i]) === f) out.push(words[i]);
    }
    return out;
  }

  function buildQueue() {
    var pool = poolFor(filter);
    for (var i = pool.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    queue = pool;
  }

  function nextWord(autoSpeak) {
    if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
    var fb = $("feedback");
    fb.className = "feedback";
    fb.textContent = "";
    $("answer").value = "";
    finalBuffer = "";
    if (micOn) { try { recog.stop(); } catch (e) {} micOn = false; }
    var mb = $("micBtn");
    if (mb) { mb.classList.remove("listening"); mb.innerHTML = "&#127908;"; }
    if ($("heard").innerHTML.indexOf("<b>") !== -1) $("heard").textContent = "";

    if (queue.length === 0) buildQueue();

    if (queue.length === 0) {
      current = null;
      $("quizBody").classList.add("hidden");
      var es = $("emptyState");
      es.classList.remove("hidden");
      es.textContent =
        filter === "mastered" ? "Nothing mastered yet. Three correct in a row moves a word here."
        : filter === "hard" ? "No hard words right now. Run the full list to find them."
        : filter === "new" ? "Every word has been tested at least once."
        : "Word list is empty. Add words under \u201cedit word list\u201d.";
      render();
      return;
    }

    $("quizBody").classList.remove("hidden");
    $("emptyState").classList.add("hidden");
    current = queue.pop();
    render();
    if (autoSpeak !== false) speak(current);
    try { $("answer").focus(); } catch (e) {}
  }

  function check() {
    if (!current) return;
    var typed = $("answer").value.trim().toLowerCase();
    if (!typed) { speak(current); return; }

    if (!progress[current]) progress[current] = { streak: 0, lastWrong: false };
    var correct = typed === current.toLowerCase();
    var fb = $("feedback");

    if (correct) {
      progress[current].streak += 1;
      progress[current].lastWrong = false;
      fb.className = "feedback show correct";
      fb.innerHTML = progress[current].streak >= 3
        ? "Correct \u2014 mastered."
        : "Correct \u2014 streak " + progress[current].streak + " of 3.";
      speak(current, 1);
      advanceTimer = setTimeout(function () { nextWord(true); }, 900);
    } else {
      progress[current].streak = 0;
      progress[current].lastWrong = true;
      fb.className = "feedback show wrong";
      fb.innerHTML = "Not quite. It\u2019s <b>" + current.toUpperCase().split("").join("-") + "</b>";
      speak(current, 0.85, true);
      advanceTimer = setTimeout(function () { nextWord(true); }, 3400);
    }
    save();
    render();
  }

  function render() {
    var mastered = 0, hard = 0;
    for (var i = 0; i < words.length; i++) {
      var s = statusOf(words[i]);
      if (s === "mastered") mastered++;
      else if (s === "hard") hard++;
    }
    $("statTotal").textContent = words.length;
    $("statMastered").textContent = mastered;
    $("statHard").textContent = hard;

    var inView = poolFor(filter).length;
    var left = queue.length + (current ? 1 : 0);
    $("progressText").textContent = inView + " in view \u00b7 " + left + " left this pass";

    var chips = [["all","All"],["hard","Hard"],["new","Untested"],["mastered","Mastered"]];
    var cEl = $("chips");
    cEl.innerHTML = "";
    chips.forEach(function (c) {
      var d = document.createElement("div");
      d.className = "chip" + (filter === c[0] ? " active" : "");
      d.textContent = c[1] + " (" + poolFor(c[0]).length + ")";
      d.addEventListener("click", function () {
        filter = c[0];
        buildQueue();
        nextWord(true);
      });
      cEl.appendChild(d);
    });

    var comb = $("comb");
    comb.innerHTML = "";
    var perRow = 9, rowIndex = 0;
    for (var k = 0; k < words.length; k += perRow) {
      var row = document.createElement("div");
      row.className = "comb-row" + (rowIndex % 2 === 1 ? " odd" : "");
      var slice = words.slice(k, k + perRow);
      for (var m = 0; m < slice.length; m++) {
        var cell = document.createElement("div");
        cell.className = "hex " + statusOf(slice[m]) + (slice[m] === current ? " current" : "");
        cell.title = slice[m];
        row.appendChild(cell);
      }
      comb.appendChild(row);
      rowIndex++;
    }
  }

  function save() {
    if (!storageOK) return;
    try {
      window.storage.set("sb-progress", JSON.stringify(progress), false);
      window.storage.set("sb-words", JSON.stringify(words), false);
    } catch (e) {}
  }

  function hydrate() {
    if (!window.storage || typeof window.storage.get !== "function") {
      $("storageNote").textContent = "Progress is kept for this session only \u2014 storage isn\u2019t available here.";
      return;
    }
    storageOK = true;
    var timeout = new Promise(function (res) { setTimeout(function () { res(null); }, 2500); });

    Promise.race([window.storage.get("sb-words").catch(function () { return null; }), timeout])
      .then(function (r) {
        if (r && r.value) {
          var parsed = JSON.parse(r.value);
          if (Array.isArray(parsed) && parsed.length) {
            words = parsed;
            $("wordArea").value = words.join("\n");
          }
        }
        return Promise.race([window.storage.get("sb-progress").catch(function () { return null; }), timeout]);
      })
      .then(function (r) {
        if (r && r.value) {
          var p = JSON.parse(r.value);
          if (p && typeof p === "object") progress = p;
        }
        buildQueue();
        render();
      })
      .catch(function () { render(); });
  }

  $("micBtn").addEventListener("click", toggleMic);
  $("speakBtn").addEventListener("click", function () { if (current) speak(current); });
  $("repeatBtn").addEventListener("click", function () { if (current) speak(current); });
  $("skipBtn").addEventListener("click", function () { nextWord(true); });
  $("defineBtn").addEventListener("click", function () { if (current) speak(current, 0.8, true); });
  $("checkBtn").addEventListener("click", check);

  $("answer").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); check(); }
  });

  $("toggleSetup").addEventListener("click", function () {
    var c = $("setupCard");
    c.style.display = c.style.display === "block" ? "none" : "block";
  });

  $("saveBtn").addEventListener("click", function () {
    var list = $("wordArea").value.split("\n").map(function (w) { return w.trim(); }).filter(Boolean);
    if (!list.length) return;
    words = list;
    save();
    buildQueue();
    nextWord(false);
  });

  $("resetBtn").addEventListener("click", function () {
    progress = {};
    save();
    buildQueue();
    nextWord(false);
  });

  $("wordArea").value = words.join("\n");
  initRecognition();
  buildQueue();
  nextWord(false);
  hydrate();
})();
</script>
</body>
</html>
